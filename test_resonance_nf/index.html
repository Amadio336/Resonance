function analyzeFullData(data) {
  // Configurazione: Cosa vogliamo contare per ogni categoria?
  const schema = {
    verb: ['tense', 'mood', 'voice', 'person', 'number', 'gend', 'case'], // I participi hanno anche genere/caso
    noun: ['case', 'gend', 'number', 'decl'],
    adjective: ['case', 'gend', 'number', 'decl'],
    pronoun: ['case', 'gend', 'number', 'decl'],
    // Puoi aggiungere altre categorie se necessario
  };

  return data.reduce((acc, item) => {
    const category = item.category;

    // 1. Inizializza la categoria se non esiste: [totale, { dettagli }]
    if (!acc[category]) {
      acc[category] = [0, {}];
    }

    // 2. Incrementa il totale generale per la categoria
    acc[category][0]++;

    // 3. Elabora i dettagli specifici
    const fieldsToAnalyze = schema[category];
    
    if (fieldsToAnalyze) {
      const detailsObj = acc[category][1];

      fieldsToAnalyze.forEach(field => {
        // Se la parola ha questa proprietà (es. ha un 'tense')
        if (item[field]) {
          const value = item[field]; // es. 'aorist'

          // Crea l'oggetto per il campo se non esiste (es. 'tense': {})
          if (!detailsObj[field]) {
            detailsObj[field] = {};
          }

          // Inizializza il contatore per il valore (es. 'aorist': 0)
          if (!detailsObj[field][value]) {
            detailsObj[field][value] = 0;
          }

          // Incrementa
          detailsObj[field][value]++;
        }
      });
    }

    return acc;
  }, {});
}
